<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="AI Hire Suite — AI-native candidate screening for recruiting teams">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1e3f"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.55"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.08"/></pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1600" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1600" height="400" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1599" height="399" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="88" y="116" font-size="17" letter-spacing="4.5" fill="#93c5fd" font-weight="600">TALENT INTELLIGENCE · SCREENING · INTERVIEW PREP</text>
    <text x="86" y="196" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">AI Hire Suite</text>
    <text x="88" y="248" font-size="27" fill="#dbeafe" font-weight="500">Every applicant scored against your rubric. Every score explained.</text>
    <text x="88" y="300" font-size="16" fill="#93a4c7" font-family="'IBM Plex Mono', Menlo, Consolas, monospace">versioned forms · rubric-weighted match scores · resume + video evaluation · generated interview questions · realtime pipeline</text>
  </g>
  <!-- candidate card stack glyph -->
  <g transform="translate(1060,92)">
    <g opacity="0.35" transform="translate(40,-26) rotate(4)"><rect width="380" height="230" rx="16" fill="#0f2a5f" stroke="#60a5fa" stroke-opacity="0.4"/></g>
    <g opacity="0.6" transform="translate(20,-13) rotate(2)"><rect width="380" height="230" rx="16" fill="#12306b" stroke="#60a5fa" stroke-opacity="0.5"/></g>
    <rect width="380" height="230" rx="16" fill="#132f66" stroke="#60a5fa" stroke-opacity="0.7"/>
    <circle cx="44" cy="46" r="20" fill="#60a5fa" fill-opacity="0.25" stroke="#93c5fd"/>
    <rect x="78" y="34" width="150" height="12" rx="6" fill="#dbeafe" fill-opacity="0.85"/>
    <rect x="78" y="54" width="100" height="9" rx="4" fill="#93c5fd" fill-opacity="0.5"/>
    <rect x="272" y="30" width="86" height="30" rx="15" fill="#16a34a" fill-opacity="0.9"/>
    <text x="315" y="50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">STRONG YES</text>
    <text x="24" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">91</text>
    <text x="84" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#93c5fd">/ 100 match</text>
    <g font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#93a4c7">
      <text x="24" y="146">product sense</text><rect x="150" y="138" width="200" height="8" rx="4" fill="#1e3a8a"/><rect x="150" y="138" width="180" height="8" rx="4" fill="#60a5fa"/>
      <text x="24" y="168">ai/ml fluency</text><rect x="150" y="160" width="200" height="8" rx="4" fill="#1e3a8a"/><rect x="150" y="160" width="160" height="8" rx="4" fill="#60a5fa"/>
      <text x="24" y="190">data &amp; metrics</text><rect x="150" y="182" width="200" height="8" rx="4" fill="#1e3a8a"/><rect x="150" y="182" width="170" height="8" rx="4" fill="#60a5fa"/>
      <text x="24" y="212">communication</text><rect x="150" y="204" width="200" height="8" rx="4" fill="#1e3a8a"/><rect x="150" y="204" width="140" height="8" rx="4" fill="#60a5fa"/>
    </g>
  </g>
</svg>
